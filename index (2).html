<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klinik Sehat - Sistem Rekam Medis</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F7F7;--card:#fff;--ink:#12262B;--mute:#5B7378;--line:#D5E2E3;--pri:#0F4C5C;--pri2:#0B3A46;--pt:#E2F0F1;--wait:#B8791B;--wt:#FBF0DB;--ok:#2D7A4F;--okt:#E1F3E9;--bad:#B5383B;--bt:#FBE4E4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1A1D;--card:#15262A;--ink:#E6F1F2;--mute:#8FA8AC;--line:#27403F;--pri:#5CC0D2;--pri2:#0A2A32;--pt:#173840;--wait:#E5B060;--wt:#3A2E15;--ok:#6CCB93;--okt:#173A29;--bad:#F08B8D;--bt:#3D1F21}}
:root[data-theme=dark]{--bg:#0E1A1D;--card:#15262A;--ink:#E6F1F2;--mute:#8FA8AC;--line:#27403F;--pri:#5CC0D2;--pri2:#0A2A32;--pt:#173840;--wait:#E5B060;--wt:#3A2E15;--ok:#6CCB93;--okt:#173A29;--bad:#F08B8D;--bt:#3D1F21}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--pri2);color:#E6F1F2;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .br{font:800 18px 'Bricolage Grotesque',sans-serif;padding:0 10px 2px}aside .sb{font-size:12px;opacity:.7;padding:0 10px 14px}
aside button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:7px;font:500 14px Figtree,sans-serif;cursor:pointer;display:flex;justify-content:space-between}
aside button.on{background:rgba(255,255,255,.14);font-weight:700}aside button:hover{background:rgba(255,255,255,.08)}
aside .me{margin-top:auto;padding:10px;font-size:13px;border-top:1px solid rgba(255,255,255,.15)}aside .me b{display:block}
.bd{background:var(--wait);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
section.pg{padding:24px;max-width:1100px;width:100%}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.hd h2{font-size:24px}.hd p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}.card h3{font-size:16px;margin-bottom:10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-left:5px solid var(--pri)}.st small{color:var(--mute)}.st b{display:block;font:800 30px 'Bricolage Grotesque',sans-serif}
.st.w{border-left-color:var(--wait)}.st.o{border-left-color:var(--ok)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute)}.bars i{display:block;width:100%;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500;font-size:13px}
.tw{overflow-x:auto}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:70px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:7px;padding:9px 15px;font:700 14px Figtree,sans-serif;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#0E1A1D}}
.btn.g{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.d{background:none;color:var(--bad);border:1px solid var(--bad)}.btn.s{padding:4px 10px;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:10px}
.t-terdaftar,.t-apotek{background:var(--wt);color:var(--wait)}.t-perawat{background:var(--pt);color:var(--pri)}.t-selesai{background:var(--okt);color:var(--ok)}.t-low{background:var(--bt);color:var(--bad)}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink);font:inherit}.item.on{border-color:var(--pri);background:var(--pt)}.item small{display:block;color:var(--mute)}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;white-space:pre-wrap}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(560px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.45)}
.obt{display:grid;grid-template-columns:2fr 70px 2fr auto;gap:6px;margin-top:6px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}.err{color:var(--bad);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}aside .br,aside .sb{display:none}aside button{white-space:nowrap}aside .me{margin:0 0 0 auto;border:0;white-space:nowrap}.two{grid-template-columns:1fr}section.pg{padding:16px}.obt{grid-template-columns:1fr 60px}}
@media print{aside,.noprint{display:none!important}.app{display:block}}
</style></head><body><div id="root"></div><dialog id="dlg"></dialog>
<script>
var KEY='rm_v3',S,cur=null,view='dash',sel=null,Q='',OPENRM=null,PEND=null,DX=[['J06.9','ISPA'],['K30','Dispepsia'],['I10','Hipertensi'],['E11.9','Diabetes melitus tipe 2'],['A09','Diare'],['R50.9','Demam'],['M79.1','Mialgia'],['L30.9','Dermatitis']];
var POLI=['Poli Umum','Poli Gigi','Poli Anak','Poli KIA'];
var USERS=[{u:'admin',p:'admin123',n:'Administrator',r:'admin'},{u:'daftar',p:'daftar123',n:'Rina',r:'daftar'},{u:'perawat',p:'perawat123',n:'Ns. Budi',r:'perawat'},{u:'dokter',p:'dokter123',n:'dr. Anita',r:'dokter'},{u:'apotek',p:'apotek123',n:'Eko',r:'apotek'}];
var RN={admin:'Administrator',daftar:'Petugas pendaftaran',perawat:'Perawat',dokter:'Dokter',apotek:'Apoteker'};
var MENU=[['dash','Dashboard',['admin','daftar','perawat','dokter','apotek']],['pasien','Data pasien',['admin','daftar','perawat','dokter']],['kunjungan','Pendaftaran',['admin','daftar']],['periksa','Pemeriksaan perawat',['admin','perawat']],['dokter','Pemeriksaan dokter',['admin','dokter']],['apotek','Apotek dan kasir',['admin','apotek']],['obat','Stok obat',['admin','apotek']],['laporan','Laporan',['admin','dokter']],['users','Manajemen User',['admin']]];
var STAT={terdaftar:'Menunggu perawat',perawat:'Menunggu dokter',apotek:'Menunggu apotek',selesai:'Selesai'};
var RF,RT;
function p2(n){return String(n).padStart(2,'0')}function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rp(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function $(i){return document.getElementById(i)}
var TODAY=ymd(new Date());RF=ymd(new Date(Date.now()-6*864e5));RT=TODAY;
function pat(rm){return S.patients.find(function(p){return p.rm===rm})||{nama:'-'}}
function by(st){return S.visits.filter(function(v){return v.status===st})}
function umur(l){if(!l)return '-';var d=new Date(l),n=new Date(),a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a+' th'}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function seed(){var P=[['Siti Rahmawati','1671000000000001','1990-04-12','P','081200000001','Jl. Sudirman, Palembang','Tidak ada','Sehat'],['Ahmad Fauzi','1671000000000002','1985-09-03','L','081200000002','Jl. Kolonel Atmo, Palembang','Penisilin','Hipertensi']];
var d={patients:P.map(function(p,i){return{rm:'RM-'+String(i+1).padStart(5,'0'),nama:p[0],nik:p[1],lahir:p[2],jk:p[3],hp:p[4],alamat:p[5],alergi:p[6],rpd:p[7]}}),drugs:[{id:'O1',nama:'Paracetamol 500 mg',stok:200,harga:1500},{id:'O2',nama:'Amoxicillin 500 mg',stok:120,harga:3000},{id:'O3',nama:'Cetirizine 10 mg',stok:80,harga:2000}],visits:[],seq:0};
for(var i=0;i<4;i++){var x=DX[i%DX.length];d.visits.push({id:'V'+i,rm:d.patients[i%2].rm,poli:'Poli Umum',no:'U'+String(i+1).padStart(3,'0'),keluhan:'Kontrol keluhan '+x[1].toLowerCase(),status:'selesai',tgl:ymd(new Date(Date.now()-i*864e5)),jam:'09:00',vital:{td:'120/80',nadi:'80',suhu:'36.7',bb:'60'},anam:'Kondisi stabil',soap:{o:'Baik',a:x[1],icd:x[0],p:'Istirahat'},resep:[{id:'O1',nama:'Paracetamol 500 mg',jml:10,aturan:'3x1'}],biaya:45000})}return d}
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}S=seed();saveUser()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveUser(){try{localStorage.setItem('rm_users',JSON.stringify(USERS))}catch(e){}}
function loadUser(){try{var u=localStorage.getItem('rm_users');if(u)USERS=JSON.parse(u)}catch(e){}}
function nextRM(){var m=S.seq||0;S.patients.forEach(function(p){m=Math.max(m,parseInt(p.rm.slice(3),10)||0)});return 'RM-'+String(m+1).padStart(5,'0')}
function fd(f){var o={},d=new FormData(f);d.forEach(function(v,k){o[k]=v});return o}
function dlg(h){$('dlg').innerHTML=h;if(!$('dlg').open)$('dlg').showModal()}function close_(){OPENRM=null;$('dlg').close()}
function konfirm(msg,fn){PEND=fn;dlg('<h3>Konfirmasi</h3><p>'+msg+'</p><div style="display:flex;gap:8px;margin-top:14px"><button class="btn d" data-a="yes">Ya, lanjutkan</button><button class="btn g" data-a="no">Batal</button></div>')}
function backDlg(){if(OPENRM&&S.patients.some(function(p){return p.rm===OPENRM}))dlg(riwayat(OPENRM));else close_()}
function dis(rs){return rs.indexOf(cur.r)>-1?'':' disabled'}
function login(){loadUser();$('root').innerHTML='<div class="login"><div class="card"><h2 style="color:var(--pri);font-size:26px">Klinik Sehat</h2><p style="color:var(--mute);margin:2px 0 8px">Sistem rekam medis rawat jalan</p><form data-f="login"><label for="u">Username</label><input id="u" name="u" required autocomplete="username"><label for="p">Kata sandi</label><input id="p" name="p" type="password" required autocomplete="current-password"><div class="err" id="er"></div><button class="btn" style="width:100%">Masuk</button></form><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><small style="color:var(--mute)">Akun contoh:</small><table style="font-size:13px;margin-top:4px">'+USERS.map(function(u){return '<tr><td><b>'+esc(u.u)+'</b> / '+esc(u.p)+'</td><td>'+RN[u.r]+'</td></tr>'}).join('')+'</table></div></div>'}
function shell(){var cnt={periksa:by('terdaftar').length,dokter:by('perawat').length,apotek:by('apotek').length};
$('root').innerHTML='<div class="app"><aside><div class="br">Klinik Sehat</div><div class="sb">Sistem rekam medis</div>'+MENU.filter(function(m){return m[2].indexOf(cur.r)>-1}).map(function(m){return '<button data-a="go" data-v="'+m[0]+'" class="'+(view===m[0]?'on':'')+'">'+m[1]+(cnt[m[0]]?'<span class="bd">'+cnt[m[0]]+'</span>':'')+'</button>'}).join('')+'<div class="me"><b>'+esc(cur.n)+'</b>'+RN[cur.r]+'<br><button data-a="me" style="padding:4px 0">Akun saya</button><button data-a="out" style="padding:4px 0">Keluar</button></div></aside><section class="pg" id="pg"></section></div>';
var V={dash:vDash,pasien:vPasien,kunjungan:vKunj,periksa:vPeriksa,dokter:vDokter,apotek:vApotek,obat:vObat,laporan:vLaporan,users:vUsers};$('pg').innerHTML=V[view]()}
function head(t,s,btn){return '<div class="hd"><div><h2>'+t+'</h2><p>'+s+'</p></div>'+(btn||'')+'</div>'}
function empty(t){return '<div class="empty">'+t+'</div>'}
function vDash(){var days=[],i;for(i=6;i>=0;i--){var d=ymd(new Date(Date.now()-i*864e5));days.push([d.slice(8)+'/'+d.slice(5,7),S.visits.filter(function(v){return v.tgl===d}).length])}
var mx=Math.max.apply(null,days.map(function(x){return x[1]}).concat([1])),dx={};S.visits.forEach(function(v){if(v.soap){dx[v.soap.a]=(dx[v.soap.a]||0)+1}});var top=Object.keys(dx).sort(function(a,b){return dx[b]-dx[a]}).slice(0,5);
var td=S.visits.filter(function(v){return v.tgl===TODAY}),act=S.visits.filter(function(v){return v.status!=='selesai'});
return head('Dashboard','Ringkasan klinik hari ini, '+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'<div class="g4"><div class="st"><small>Total pasien</small><b>'+S.patients.length+'</b></div><div class="st"><small>Kunjungan hari ini</small><b>'+td.length+'</b></div><div class="st w"><small>Sedang dalam proses</small><b>'+act.length+'</b></div><div class="st o"><small>Selesai hari ini</small><b>'+td.filter(function(v){return v.status==='selesai'}).length+'</b></div></div><div class="cols"><div class="card"><h3>Kunjungan 7 hari terakhir</h3><div class="bars">'+days.map(function(x){return '<div><span>'+x[1]+'</span><i style="height:'+(x[1]/mx*100)+'%"></i><span>'+x[0]+'</span></div>'}).join('')+'</div></div><div class="card"><h3>Diagnosis terbanyak</h3>'+(top.length?'<table>'+top.map(function(k){return '<tr><td>'+esc(k)+'</td><td><b>'+dx[k]+'</b></td></tr>'}).join('')+'</table>':empty('Belum ada diagnosis.'))+'</div></div><div class="card"><h3>Antrean aktif</h3>'+(act.length?'<div class="tw"><table><tr><th>No</th><th>Pasien</th><th>Poli</th><th>Status</th></tr>'+act.map(function(v){return '<tr><td>'+v.no+'</td><td>'+esc(pat(v.rm).nama)+'</td><td>'+esc(v.poli)+'</td><td><span class="tag t-'+v.status+'">'+STAT[v.status]+'</span></td></tr>'}).join('')+'</table></div>':empty('Tidak ada antrean.'))+'</div>'}
function pasForm(p){p=p||{};return '<h3>'+(p.rm?'Ubah data pasien':'Pasien baru')+'</h3><form data-f="pasien"><input type="hidden" name="rm" value="'+esc(p.rm||'')+'"><label>Nama lengkap</label><input name="nama" required value="'+esc(p.nama)+'"><div class="row"><div><label>NIK</label><input name="nik" required maxlength="16" inputmode="numeric" value="'+esc(p.nik)+'"></div><div><label>Tanggal lahir</label><input name="lahir" type="date" required value="'+esc(p.lahir)+'"></div></div><div class="row"><div><label>Jenis kelamin</label><select name="jk"><option value="L"'+(p.jk==='L'?' selected':'')+'>Laki-laki</option><option value="P"'+(p.jk==='P'?' selected':'')+'>Perempuan</option></select></div><div><label>No. HP</label><input name="hp" value="'+esc(p.hp)+'"></div></div><label>Alamat</label><input name="alamat" value="'+esc(p.alamat)+'"><div class="row"><div><label>Riwayat Alergi</label><input name="alergi" value="'+esc(p.alergi||'Tidak ada')+'"></div><div><label>Riwayat Penyakit Dahulu (RPD)</label><input name="rpd" value="'+esc(p.rpd||'-')+'"></div></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn">Simpan</button><button type="button" class="btn g" data-a="close">Batal</button></div></form>'}
function pasRows(){var q=Q.toLowerCase(),ps=S.patients.filter(function(p){return (p.nama+p.rm+p.nik).toLowerCase().indexOf(q)>-1});if(!ps.length)return empty('Tidak ada pasien yang cocok.');
return '<div class="tw"><table><tr><th>No. RM</th><th>Nama</th><th>Umur</th><th>JK</th><th>HP</th><th>Alergi</th><th></th></tr>'+ps.map(function(p){return '<tr><td>'+p.rm+'</td><td>'+esc(p.nama)+'</td><td>'+umur(p.lahir)+'</td><td>'+p.jk+'</td><td>'+esc(p.hp)+'</td><td>'+esc(p.alergi||'-')+'</td><td style="white-space:nowrap"><button class="btn g s" data-a="det" data-id="'+p.rm+'">Riwayat</button> <button class="btn g s" data-a="edp" data-id="'+p.rm+'">Ubah</button>'+(cur.r==='admin'?' <button class="btn d s" data-a="delp" data-id="'+p.rm+'">Hapus</button>':'')+'</td></tr>'}).join('')+'</table></div>'}
function vPasien(){return head('Data pasien',S.patients.length+' pasien terdaftar',(cur.r==='admin'||cur.r==='daftar'?'<button class="btn" data-a="newp">Tambah pasien</button>':''))+'<div class="card"><input id="q" placeholder="Cari nama, No. RM, atau NIK" value="'+esc(Q)+'"><div id="tb" style="margin-top:12px">'+pasRows()+'</div></div>'}
function vact(v){var h='<button class="btn g s" data-a="edv" data-id="'+v.id+'">Ubah</button>';if(cur.r==='admin'||(cur.r==='daftar'&&v.status==='terdaftar'))h+=' <button class="btn d s" data-a="delv" data-id="'+v.id+'">'+(v.status==='terdaftar'?'Batalkan':'Hapus')+'</button>';return h}
function riwayat(rm){var p=pat(rm),vs=S.visits.filter(function(v){return v.rm===rm}).sort(function(a,b){return (b.tgl+b.jam).localeCompare(a.tgl+a.jam)});
return '<h3>'+esc(p.nama)+'</h3><dl class="kv"><dt>No. RM</dt><dd>'+p.rm+'</dd><dt>NIK</dt><dd>'+esc(p.nik)+'</dd><dt>Lahir</dt><dd>'+esc(p.lahir)+' ('+umur(p.lahir)+') · '+(p.jk==='L'?'Laki-laki':'Perempuan')+'</dd><dt>Kontak & Alamat</dt><dd>'+esc(p.hp||'-')+' · '+esc(p.alamat||'-')+'</dd><dt>Riwayat Alergi</dt><dd style="color:var(--bad);font-weight:700">'+esc(p.alergi||'Tidak ada')+'</dd><dt>Penyakit Dahulu</dt><dd>'+esc(p.rpd||'-')+'</dd></dl><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><b>Riwayat kunjungan</b>'+(vs.length?vs.map(function(v){return '<div class="card" style="margin:8px 0 0"><b>'+esc(v.tgl)+' · '+esc(v.poli)+'</b> <span class="tag t-'+v.status+'">'+STAT[v.status]+'</span><dl class="kv" style="margin-top:6px"><dt>Keluhan</dt><dd>'+esc(v.keluhan)+'</dd>'+(v.vital?'<dt>Tanda vital</dt><dd>TD '+esc(v.vital.td)+' · Nadi '+esc(v.vital.nadi)+' · '+esc(v.vital.suhu)+' °C · '+esc(v.vital.bb)+' kg</dd>':'')+(v.soap?'<dt>Diagnosis</dt><dd>'+esc(v.soap.icd)+' '+esc(v.soap.a)+'</dd><dt>Terapi/Resep</dt><dd>'+esc(v.soap.p)+(v.resep&&v.resep.length?'\n'+v.resep.map(function(r){return '• '+esc(r.nama)+' x'+r.jml+' ('+esc(r.aturan)+')'}).join('\n'):'')+'</dd>':'')+'</dl><div class="noprint" style="margin-top:8px">'+vact(v)+'</div></div>'}).join(''):empty('Belum ada kunjungan.'))+'<div class="noprint" style="margin-top:14px;display:flex;gap:8px"><button class="btn g" onclick="window.print()">Cetak</button><button class="btn" data-a="close">Tutup</button></div>'}

bayar:function(f){var v=curV('apotek'),d=fd(f);v.resep.forEach(function(r){S.drugs.find(function(x){return x.id===r.id}).stok-=r.jml});v.biaya=total(v);v.status='selesai';v.paid=true;sel=null;save();shell();
dlg('<h3>Nota Pembayaran</h3><p style="margin:0;color:var(--mute)">'+esc(pat(v.rm).nama)+' · '+v.tgl+'</p><table style="margin-top:8px">'+v.resep.map(function(r){return '<tr><td>'+esc(r.nama)+' x'+r.jml+'</td><td>'+rp(S.drugs.find(function(x){return x.id===r.id}).harga*r.jml)+'</td></tr>'}).join('')+'<tr><td>Jasa dokter</td><td>'+rp(30000)+'</td></tr><tr><td><b>Total</b></td><td><b>'+rp(v.biaya)+'</b></td></tr><tr><td>Diterima</td><td>'+rp(d.bayar)+'</td></tr><tr><td>Kembalian</td><td>'+rp(d.bayar-v.biaya)+'</td></tr></table><div style="margin-top:14px;display:flex;gap:8px"><button class="btn g" onclick="window.print()">Cetak Nota</button><button class="btn g" data-a="sakit" data-id="'+v.id+'">Buat Surat Sakit</button><button class="btn" data-a="close">Selesai</button></div>')},
obat:function(f){var d=fd(f);if(d.id){var o=S.drugs.find(function(x){return x.id===d.id});o.nama=d.nama.trim();o.stok=+d.stok;o.harga=+d.harga}else{S.drugs.push({id:'O'+Date.now(),nama:d.nama.trim(),stok:+d.stok,harga:+d.harga})}save();close_();shell();toast('Obat disimpan')},
user:function(f){var d=fd(f);if(USERS.some(function(x){return x.u===d.u.trim()})){alert('Username sudah dipakai.');return}USERS.push({u:d.u.trim(),p:d.p,n:d.n.trim(),r:d.r});saveUser();close_();shell();toast('Staf ditambahkan')},
useredit:function(f){var d=fd(f),u=USERS.find(function(x){return x.u===d.u});u.n=d.n.trim();if(d.r)u.r=d.r;if(d.p)u.p=d.p;saveUser();close_();shell();toast('Akun diperbarui')}};
